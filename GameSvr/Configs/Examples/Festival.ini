; Festival.ini - 节日活动配置文件
; 对应原版战神引擎 EA 0x00624A1C (sub_624A1C)
;
; 说明：
; - 此配置用于设置时间限定的节日活动和经验/掉落加成
; - 可配置多个事件段，按 [Event1], [Event2] ... 依次编号
; - GlobalExpMultiplier/GlobalDropMultiplier 为全局基础倍率
; - 事件的 ExpBonus/DropBonus 会与全局倍率相乘
; - 时间格式：YYYY-MM-DD HH:MM:SS

[Festival]
; 启用节日模式 (0=关闭 1=启用)
Enabled=0

; 全局经验倍率
GlobalExpMultiplier=1.0

; 全局掉落倍率
GlobalDropMultiplier=1.0

; 启用节日公告 (0=关闭 1=启用)
Announcement=1

; 公告间隔 (秒)
AnnouncementInterval=3600

; ============ 节日事件配置 ============

[Event1]
; 事件名称
Name=春节活动

; 开始时间
StartTime=2026-01-25 00:00:00

; 结束时间
EndTime=2026-02-10 23:59:59

; 经验加成倍率
ExpBonus=2.0

; 掉落加成倍率
DropBonus=1.5

; 启用此事件 (0=关闭 1=启用)
Enabled=0

[Event2]
; 事件名称
Name=国庆活动

; 开始时间
StartTime=2026-10-01 00:00:00

; 结束时间
EndTime=2026-10-07 23:59:59

; 经验加成倍率
ExpBonus=3.0

; 掉落加成倍率
DropBonus=2.0

; 启用此事件 (0=关闭 1=启用)
Enabled=0

[Event3]
; 事件名称
Name=周末双倍

; 开始时间 (每周六)
StartTime=2026-08-16 00:00:00

; 结束时间 (每周日)
EndTime=2026-08-17 23:59:59

; 经验加成倍率
ExpBonus=2.0

; 掉落加成倍率
DropBonus=1.0

; 启用此事件 (0=关闭 1=启用)
Enabled=0
