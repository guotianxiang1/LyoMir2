; Hero.ini - 英雄系统配置文件
; 对应原版战神引擎 EA 0x00621710 (sub_621710)
;
; 说明：
; - 此配置影响英雄的召唤、成长、战斗等核心参数
; - RecallLevel 必须 <= MaxLevel
; - ExpRate 为百分比，100表示100%
; - DieRecallTime 单位为秒

[Hero]
; 英雄最大等级
MaxLevel=255

; 可召唤英雄的玩家等级要求
RecallLevel=40

; 英雄可学习技能的最低等级
LearnSkillLevel=19

; 英雄死亡后重新召唤等待时间 (秒)
DieRecallTime=3600

; 忠诚度衰减速率
LoyaltyDecRate=1

; 英雄经验获取比例 (百分比)
ExpRate=100

; 启用英雄自动拾取 (0=关闭 1=启用)
AutoPickup=1

; 启用英雄守护模式 (0=关闭 1=启用)
GuardEnabled=1

; 英雄背包最大负重
MaxBagWeight=1000
