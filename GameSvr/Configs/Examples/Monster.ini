; Monster.ini - 怪物系统配置文件
; 对应原版战神引擎 EA 0x00610A94 (sub_610A94)
;
; 说明：
; - 此配置影响怪物刷新、AI行为、掉落等核心参数
; - RegenInterval 影响服务器CPU负载
; - ExpRate/DropRate 为倍率，1.0表示100%
; - MaxCount 限制地图上同时存在的怪物总数

[Monster]
; 怪物刷新检测间隔 (毫秒)
RegenInterval=1000

; 怪物搜索玩家范围 (格子数)
SearchRange=12

; 怪物攻击速度 (毫秒)
AttackSpeed=1000

; 怪物经验倍率
ExpRate=1.0

; 怪物掉落倍率
DropRate=1.0

; 启用怪物原地复活 (0=关闭 1=启用)
; 注意：战神引擎已移除此功能，建议保持关闭
EnableRevive=0

; 最大复活次数
MaxReviveTimes=0

; 怪物AI刷新间隔 (毫秒)
AiTickInterval=500

; 启用BOSS出现全服公告 (0=关闭 1=启用)
BossNotification=1

; 地图最大怪物数量
MaxCount=5000
