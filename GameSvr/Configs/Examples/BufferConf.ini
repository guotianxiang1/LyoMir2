; BufferConf.ini - 缓冲区配置文件
; 对应原版战神引擎 EA 0x0060FC88 (sub_60FC88)
;
; 说明：
; - 此配置影响服务器网络层性能和内存占用
; - 发送/接收缓冲区大小建议设置为2的幂次方
; - 缓冲池数量根据在线人数调整
; - 队列大小影响峰值流量处理能力

[Buffer]
; 发送缓冲区大小 (字节)
SendBufferSize=8192

; 接收缓冲区大小 (字节)
RecvBufferSize=8192

; 发送缓冲池初始数量
SendBufferPoolCount=1000

; 接收缓冲池初始数量
RecvBufferPoolCount=1000

; 最大发送队列大小
MaxSendQueueSize=10000

; 最大接收队列大小
MaxRecvQueueSize=10000

; 启用缓冲池 (0=关闭 1=启用)
EnablePooling=1

; 缓冲池自动扩展步长
PoolExpandStep=100

; 缓冲池最大容量
MaxPoolSize=10000
